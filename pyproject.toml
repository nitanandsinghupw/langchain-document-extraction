[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-extraction"
version = "0.1.0"
description = "Invoice and contract extraction with LangChain: typed JSON, evidence checks, business rules, review queue."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.6,<2",
    "pydantic>=2.7,<3",
    "pypdf>=5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.0"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "reportlab>=4"]

[project.scripts]
doc-extract = "doc_extraction.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
